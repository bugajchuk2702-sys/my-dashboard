<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дашборд">
<title>Мой дашборд</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg1:#e9eefb;--bg2:#f6f0ff;
  --glass:rgba(255,255,255,.55);--glass-hi:rgba(255,255,255,.78);--stroke:rgba(255,255,255,.8);
  --tx:#1d1d1f;--tx2:rgba(60,60,67,.62);--fill:rgba(120,120,128,.14);--sep:rgba(60,60,67,.12);
  --segon:#fff;--sh:0 10px 40px rgba(40,50,120,.10),0 1px 0 rgba(255,255,255,.9) inset;
  --blue:#0a84ff;--green:#23a04b;--orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;--teal:#64d2ff;--pink:#ff375f;
  --accent:#0a84ff;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg1:#09090f;--bg2:#13101d;--glass:rgba(44,44,52,.50);--glass-hi:rgba(58,58,68,.72);--stroke:rgba(255,255,255,.13);
    --tx:#f5f5f7;--tx2:rgba(235,235,245,.60);--fill:rgba(120,120,128,.28);--sep:rgba(255,255,255,.10);
    --segon:rgba(110,110,120,.55);--sh:0 10px 40px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.08) inset;color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg1:#09090f;--bg2:#13101d;--glass:rgba(44,44,52,.50);--glass-hi:rgba(58,58,68,.72);--stroke:rgba(255,255,255,.13);
  --tx:#f5f5f7;--tx2:rgba(235,235,245,.60);--fill:rgba(120,120,128,.28);--sep:rgba(255,255,255,.10);
  --segon:rgba(110,110,120,.55);--sh:0 10px 40px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.08) inset;color-scheme:dark;
}
body[data-tab=personal]{--accent:#0a84ff}
body[data-tab=finance]{--accent:#23a04b}
body[data-tab=growth]{--accent:#bf5af2}
body[data-tab=stats]{--accent:#ff375f}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg1)}
body{margin:0;min-height:100vh;color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  font-size:15px;line-height:1.4;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg i{position:absolute;border-radius:50%;opacity:.5}
.bg i:nth-child(1){width:48vmax;height:48vmax;left:-12vmax;top:-14vmax;background:radial-gradient(closest-side,var(--accent),transparent)}
.bg i:nth-child(2){width:40vmax;height:40vmax;right:-14vmax;top:18vh;background:radial-gradient(closest-side,#5e5ce6,transparent);opacity:.38}
.bg i:nth-child(3){width:38vmax;height:38vmax;left:20vw;bottom:-22vmax;background:radial-gradient(closest-side,#ff6bb5,transparent);opacity:.30}
@keyframes f1{to{transform:translate(8vmax,6vmax) scale(1.1)}}
@keyframes f2{to{transform:translate(-8vmax,-5vmax) scale(.92)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}*{transition:none!important}}

.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:calc(max(14px,env(safe-area-inset-top)) + 80px) 20px 48px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 4px 22px}
#date{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tx2)}
h1{margin:2px 0 0;font-size:clamp(30px,5vw,44px);font-weight:700;letter-spacing:-.035em;line-height:1.05}
.hdr-r{display:flex;align-items:center;gap:10px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);border:1px solid var(--stroke);box-shadow:var(--sh)}
.pill{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600}
.pill b{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(35,160,75,.25)}
.pill.off b{background:var(--orange);box-shadow:0 0 0 3px rgba(255,159,10,.28)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--tx);cursor:pointer;border:1px solid var(--stroke);padding:0;font:inherit}
.icon-btn:hover{background:var(--glass-hi)}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1000px){.c3{grid-column:span 6}.c4,.c5{grid-column:span 6}.c7,.c8{grid-column:span 12}}
@media (max-width:640px){.hero .big{font-size:30px}.hero{gap:10px}.stats{gap:16px}.ring{transform:scale(.85);transform-origin:right center}.grid{gap:12px}.c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}.c3.half{grid-column:span 6}}

.card{border-radius:28px;padding:20px 22px;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);border:1px solid var(--stroke);box-shadow:var(--sh);animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.grid>.card:nth-child(2){animation-delay:.04s}.grid>.card:nth-child(3){animation-delay:.08s}.grid>.card:nth-child(4){animation-delay:.12s}.grid>.card:nth-child(5){animation-delay:.16s}.grid>.card:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.card h3{margin:0 0 12px;font-size:17px;font-weight:650;letter-spacing:-.02em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-size:13px;font-weight:500;color:var(--tx2)}
.lbl{font-size:13px;font-weight:500;color:var(--tx2)}
.big{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums}
.big.sm{font-size:26px}
.delta{font-size:12px;font-weight:600;margin-top:4px}
.up{color:var(--green)}.down{color:var(--red)}
.empty{color:var(--tx2);font-size:14px;margin:4px 0 10px}
.acc{color:var(--accent)}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:150px}
.hero .big{font-size:40px}
.stats{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap}
.stats div b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}

.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--sep)}
.row:last-of-type{border-bottom:0}
.row.done .grow{color:var(--tx2);text-decoration:line-through}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--tx2);background:transparent;color:transparent;display:grid;place-items:center;cursor:pointer;padding:0;transition:.2s}
.chk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.x{flex:none;border:0;background:transparent;color:var(--tx2);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:8px;opacity:.5;font-family:inherit}
.x:hover{opacity:1;background:var(--fill)}
form.add{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
input,select,textarea{font:inherit;color:inherit;background:var(--fill);border:0;border-radius:13px;padding:10px 13px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 2.5px color-mix(in srgb,var(--accent) 55%,transparent)}
input::placeholder,textarea::placeholder{color:var(--tx2)}
form.add input[type=text],form.add input:not([type]){flex:1 1 90px;min-width:0}
form.add input[type=number]{flex:0 1 90px;min-width:0}
form.add input[type=date]{flex:0 1 140px;min-width:0}
form.add select{flex:0 1 105px;min-width:0}
form.add .btn{flex:0 0 auto}
textarea{width:100%;resize:vertical;min-height:130px;line-height:1.5}
select{appearance:none;-webkit-appearance:none;padding-right:13px}
.btn{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:10px 17px;border-radius:99px;cursor:pointer;transition:transform .15s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--fill);color:var(--tx)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{background:rgba(255,69,58,.14);color:var(--red)}

.seg{display:flex;background:var(--fill);padding:3px;border-radius:13px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--tx);font:inherit;font-weight:550;font-size:14px;padding:7px 10px;border-radius:10px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--segon);box-shadow:0 1px 4px rgba(0,0,0,.14)}

.bar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.item{padding:10px 0;border-bottom:1px solid var(--sep)}
.item:last-of-type{border-bottom:0}
.item .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.item .top span:first-child{font-weight:560;overflow-wrap:anywhere}
.val{font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;padding:0;background:transparent;border-radius:0;box-shadow:none!important}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--fill) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.08)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--fill) var(--p,0%))}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.28)}

.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;font-size:22px;font-weight:700;letter-spacing:-.03em}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .tr{stroke:var(--fill)}
.ring .pg{stroke:var(--accent);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}

.hab{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--sep)}
.hab:last-of-type{border-bottom:0}
.hab .nm{flex:1;min-width:0;font-weight:560;overflow-wrap:anywhere}
.hab .nm small{display:block;font-weight:500;font-size:12px;color:var(--tx2)}
.days{display:flex;gap:5px}
.d{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--tx2);text-transform:uppercase}
.d button{width:24px;height:24px;border-radius:50%;border:0;background:var(--fill);cursor:pointer;padding:0;transition:.2s}
.d button.on{background:var(--accent);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 50%,transparent)}
.d.t button{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}

.moods{display:flex;gap:6px;justify-content:space-between}
.moods button{flex:1;font-size:26px;border:0;background:var(--fill);border-radius:16px;padding:8px 0;cursor:pointer;filter:grayscale(.85);opacity:.7;transition:.2s}
.moods button.on{filter:none;opacity:1;background:color-mix(in srgb,var(--accent) 22%,transparent);transform:scale(1.07)}
.water{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px}
.water button{aspect-ratio:1/1.35;border:0;border-radius:9px 9px 13px 13px;background:var(--fill);cursor:pointer;padding:0;transition:.25s}
.water button.on{background:linear-gradient(180deg,#8fd3ff,#0a84ff)}

.donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut svg{flex:none;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:16}
.leg{flex:1;min-width:150px;font-size:14px}
.leg div{display:flex;align-items:center;gap:8px;padding:3px 0}
.leg i{width:10px;height:10px;border-radius:50%;flex:none}
.leg span:last-child{margin-left:auto;color:var(--tx2);font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.chart .b{width:100%;max-width:56px;border-radius:12px 12px 6px 6px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 55%,transparent));min-height:4px;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.chart .col.dim .b{background:var(--fill)}
.chart small{font-size:11px;color:var(--tx2)}
.chart em{font-style:normal;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}

.tx .amt{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx .amt.in{color:var(--green)}
.tx .amt.sv{color:var(--accent)}
.tx small{display:block;color:var(--tx2);font-size:12px}
.badge{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}

.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kan{grid-template-columns:1fr}}
.col-k{background:var(--fill);border-radius:20px;padding:12px;min-height:120px}
.col-k h4{margin:2px 4px 10px;font-size:13px;font-weight:650;color:var(--tx2);display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.04em}
.deal{background:var(--glass-hi);border-radius:16px;padding:11px 12px;margin-bottom:8px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.deal b{display:block;font-weight:600;overflow-wrap:anywhere}
.deal .m{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:6px}
.deal .m span{font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums}
.deal .m div{display:flex;gap:2px}
.deal .m button{border:0;background:var(--fill);color:var(--tx);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px;padding:0}
.deal .m button:disabled{opacity:.3;cursor:default}
.more{font-size:12px;color:var(--tx2);text-align:center;padding:4px}

.mbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.yr{display:flex;align-items:center;gap:8px;font-weight:650;font-size:16px}
.mchips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;margin:0 -2px 6px}
.mchips::-webkit-scrollbar{display:none}
.mchips button{flex:none;border:0;background:var(--fill);color:var(--tx);font:inherit;font-weight:560;font-size:14px;padding:8px 15px;border-radius:99px;cursor:pointer;transition:.2s}
.mchips button.on{background:var(--accent);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.mchips button.cur:not(.on){box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 60%,transparent)}
.htiles{display:grid;align-items:start;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.htile{background:var(--fill);border-radius:22px;padding:14px 14px 12px}
.htop{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.htop .nm{flex:1;min-width:0;font-weight:640;font-size:16px;overflow-wrap:anywhere}
.htop .nm small{display:block;font-size:12px;color:var(--tx2);font-weight:500;margin-top:1px}
.chk.lg{width:32px;height:32px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal b{font-size:10px;color:var(--tx2);text-align:center;font-weight:600;text-transform:uppercase;padding-bottom:2px}
.cal button,.cal span{aspect-ratio:1;border-radius:50%}
.cal button{border:0;background:var(--glass-hi);color:var(--tx2);font:inherit;font-size:11px;cursor:pointer;padding:0;transition:.2s;display:grid;place-items:center}
.cal button.on{background:var(--accent);color:#fff;font-weight:650;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 45%,transparent)}
.cal button.rest{background:transparent;box-shadow:inset 0 0 0 1.5px var(--sep)}
.cal button.off{opacity:.45}
.cal button.t{outline:2px solid color-mix(in srgb,var(--accent) 65%,transparent);outline-offset:1px}
.cal button:disabled{opacity:.22;cursor:default}
.hfoot{margin-top:11px;font-size:12px;color:var(--tx2)}
.hfoot .bar{margin-top:6px;height:6px}
.hedit{background:var(--glass-hi);border-radius:16px;padding:10px;margin-bottom:10px}
.hedit .seg button{font-size:12px;padding:6px 4px}
.wds{display:flex;gap:4px;margin-top:8px}
.wds button{flex:1;border:0;background:var(--fill);color:var(--tx);font:inherit;font-size:12px;font-weight:560;padding:6px 0;border-radius:9px;cursor:pointer}
.wds button.on{background:var(--accent);color:#fff}
.hadd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.hadd input{flex:1 1 180px}
.hadd .seg{flex:0 1 270px}
.hadd .seg button{font-size:13px;padding:7px 8px}
.hadd .wds{flex:1 1 100%;margin:0}

.mrow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mrow .mchips{flex:1;min-width:0;margin:0;padding:2px 2px 8px}
.mrow .yr{flex:none}
.hscroll{overflow-x:auto;margin:0 -8px;padding:0 8px 6px;scrollbar-width:thin}
.hm{min-width:max-content}
.hr{display:flex;align-items:center;gap:4px;padding:6px 0;border-bottom:1px solid var(--sep)}
.hr:last-child{border-bottom:0}
.hh{padding:0 0 4px}
.hn{position:sticky;left:0;z-index:2;flex:none;width:158px;padding:2px 8px 2px 4px;margin-right:2px;background:var(--glass-hi);border-radius:12px;cursor:pointer}
.hh .hn{background:transparent}
.hn b{display:block;font-weight:620;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hn small{display:block;font-size:11px;color:var(--tx2);white-space:nowrap}
.dn{flex:none;width:24px;text-align:center;font-size:10px;color:var(--tx2);font-variant-numeric:tabular-nums}
.dn.t{color:var(--accent);font-weight:700}
.hr .c{flex:none;width:24px;height:24px;border-radius:50%;border:0;padding:0;background:var(--fill);cursor:pointer;transition:.2s}
.hr .c.on{background:var(--accent);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 40%,transparent)}
.hr .c.rest{background:transparent;box-shadow:inset 0 0 0 1.5px var(--sep)}
.hr .c.off{opacity:.4}
.hr .c.t{outline:2px solid color-mix(in srgb,var(--accent) 65%,transparent);outline-offset:1px}
.hr .c:disabled{opacity:.2;cursor:default}
.hr .c.sk{display:grid;place-items:center;background:rgba(255,69,58,.14);box-shadow:inset 0 0 0 1.5px rgba(255,69,58,.35)}
.hr .c.sk::after{content:'✕';color:var(--red);font-size:11px;font-weight:700;line-height:1}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sring .ring span{font-size:17px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px;margin-top:14px}
.kv b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.kv span{font-size:12px;color:var(--tx2)}
.wbars{display:flex;align-items:flex-end;gap:8px;height:84px;margin-top:8px}
.wbars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}
.wbars .b{width:100%;max-width:36px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 50%,transparent));min-height:3px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.wbars small{font-size:10px;color:var(--tx2);text-transform:uppercase}
.hview{min-width:220px;font-weight:500}
.hview button{font-size:13px;padding:6px 10px}
.ssum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:2px 0 8px}
.ssum div{background:var(--fill);border-radius:16px;padding:10px 14px}
.ssum b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.ssum span{font-size:12px;color:var(--tx2)}

.srow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--sep)}
.srow:last-child{border-bottom:0}
.sn{flex:0 0 150px;min-width:0}
.sn b{display:block;font-weight:620;overflow-wrap:anywhere}
.sn small{font-size:11px;color:var(--tx2)}
.sp{flex:1 1 150px;min-width:130px}
.sp .l{font-size:13px;display:flex;justify-content:space-between;margin-bottom:5px;color:var(--tx2)}
.sv{flex:none;text-align:center;min-width:54px}
.sv b{display:block;font-size:17px;font-weight:700}
.sv span{font-size:11px;color:var(--tx2)}
.sw{flex:none;display:flex;align-items:flex-end;gap:4px;height:46px}
.sw .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.sw .b{width:12px;border-radius:4px;background:var(--accent)}
.sw small{font-size:9px;color:var(--tx2)}
.wbar{display:flex;align-items:center;justify-content:center;gap:10px;width:fit-content;max-width:100%;margin:-6px auto 18px;padding:7px 12px;border-radius:99px}
.wbar .btn:disabled{opacity:.35;cursor:default}
.wlab{min-width:120px;text-align:center;line-height:1.2}
.wlab b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em}
.wlab small{font-size:11px;color:var(--tx2)}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.pcol{background:var(--fill);border-radius:18px;padding:10px 12px 8px;min-height:120px}
.pcol.t{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}
.pcol h4{margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em}
.pcol h4 b{font-size:17px;color:var(--tx);letter-spacing:-.02em}
.pcol.t h4 b{color:var(--accent)}
.pcol .row{padding:6px 0;gap:8px;font-size:14px}
.pcol .chk{width:20px;height:20px}
.pcol form.add{margin-top:6px}
.pcol form.add input{padding:7px 10px;font-size:13px;flex:1 1 100%;background:var(--glass-hi)}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px;text-align:center}
.wk7 div{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--tx2);padding:4px 0;border-radius:10px}
.wk7 div.t{background:var(--fill)}
.wk7 span{font-size:17px;line-height:1.2}
.wk7 em{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums;min-height:13px}
.chart .col.sel{cursor:pointer}
.hedit{margin-top:10px}

nav.tabs{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);z-index:20;display:flex;gap:4px;padding:6px;border-radius:99px;
  background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);border:1px solid var(--stroke);
  box-shadow:0 10px 36px rgba(30,40,100,.14),0 1px 0 rgba(255,255,255,.6) inset;max-width:calc(100vw - 20px)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--tx2);font:inherit;font-size:11px;font-weight:600;
  padding:9px 20px 7px;border-radius:99px;cursor:pointer;transition:.3s cubic-bezier(.2,.8,.2,1);min-width:0}
nav.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{background:var(--fill);color:var(--accent)}
@media (max-width:520px){nav.tabs button{padding:8px 7px 6px;font-size:10px}nav.tabs{gap:0}}
@media (min-width:900px){nav.tabs button{flex-direction:row;gap:8px;font-size:14px;padding:11px 22px}}

.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.32);;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{width:min(520px,100%);max-height:88vh;overflow:auto;border-radius:32px 32px 0 0;padding:22px 22px max(26px,env(safe-area-inset-bottom));background:var(--glass-hi);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--stroke);animation:up .4s cubic-bezier(.2,.8,.2,1) both}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:32px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 16px;font-size:22px;letter-spacing:-.03em;display:flex;justify-content:space-between;align-items:center}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--sep)}
.set:last-of-type{border-bottom:0}
.set .seg{min-width:200px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.note{font-size:12px;color:var(--tx2);margin-top:14px}

<script>
(()=>{
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const today=()=>iso(new Date());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n))+' '+S.cur;
const fmtK=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(n>=1e4?0:1)+'к':String(Math.round(n));
const dshort=d=>new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const streak=has=>{let n=0,d=new Date();if(!has(iso(d)))d=addDays(d,-1);while(has(iso(d))){n++;d=addDays(d,-1)}return n};

/* ---------- привычки: расписание, серии, месяцы ---------- */
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],WDL=['П','В','С','Ч','П','С','В'];
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const FREQS=[['daily','Ежедневно'],['alt','Через день'],['dow','По дням']];
const HAB_START='2026-11';
let habMonth=today().slice(0,7)<HAB_START?HAB_START:today().slice(0,7),editHab=null,newFreq='daily',newDow=[],newHabName='';
const dkey=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const kdate=k=>new Date(k+'T00:00:00');
const wdMon=dt=>(dt.getDay()+6)%7;
const prevKey=k=>iso(addDays(kdate(k),-1));
function isDue(h,k){
  const f=h.freq||'daily';
  if(f==='daily')return true;
  if(f==='dow')return (h.dow||[]).includes(wdMon(kdate(k)));
  return !h.days[prevKey(k)];            // «через день»: после выполненного дня — отдых
}
function habStreak(h){
  const f=h.freq||'daily',t=today();
  if(f==='alt'){
    let cur=null;
    for(let i=0;i<=2;i++){const d=addDays(kdate(t),-i);if(h.days[iso(d)]){cur=d;break}}
    if(!cur)return 0;
    let n=0;
    while(cur){n++;let nx=null;for(let i=1;i<=2;i++){const d=addDays(cur,-i);if(h.days[iso(d)]){nx=d;break}}cur=nx}
    return n;
  }
  let n=0,d=kdate(t);
  for(let i=0;i<800;i++){const k=iso(d);
    if(h.days[k])n++;else if((h.skip&&h.skip[k])||(isDue(h,k)&&k!==t))break;
    d=addDays(d,-1)}
  return n;
}
function monthStats(h,y,m){
  const dim=new Date(y,m+1,0).getDate(),t=today();let done=0,plan=0,skip=0;
  for(let d=1;d<=dim;d++){const k=dkey(y,m,d);if(k>t)break;if(h.days[k])done++;if(h.skip&&h.skip[k])skip++;if((h.freq||'daily')!=='alt'&&(isDue(h,k)||h.days[k]))plan++}
  return {done,skip,plan:(h.freq||'daily')==='alt'?null:plan};
}
function bestStreak(h){
  const keys=Object.keys(h.days).sort();if(!keys.length)return 0;
  const f=h.freq||'daily',t=today();
  if(f==='alt'){let best=1,n=1;for(let i=1;i<keys.length;i++){const gap=Math.round((kdate(keys[i])-kdate(keys[i-1]))/864e5);n=gap<=2?n+1:1;if(n>best)best=n}return best}
  let best=0,n=0,d=kdate(keys[0]);const end=kdate(t);
  while(d<=end){const k=iso(d);if(h.days[k]){n++;if(n>best)best=n}else if((h.skip&&h.skip[k])||(isDue(h,k)&&k!==t))n=0;d=addDays(d,1)}
  return best;
}
function weekdayStats(h,y,m){
  const dim=new Date(y,m+1,0).getDate(),t=today(),done=Array(7).fill(0),plan=Array(7).fill(0);
  for(let d=1;d<=dim;d++){const k=dkey(y,m,d);if(k>t)break;const w=wdMon(kdate(k));if(h.days[k]){done[w]++;plan[w]++}else if(isDue(h,k)&&!(k===t))plan[w]++}
  return {done,plan};
}
function monthChipsHtml(){
  const cur=today().slice(0,7);
  return `<div class="mrow"><div class="mchips">${monthKeys().map(key=>{const [ky,km]=key.split('-').map(Number);return `<button class="${key===habMonth?'on':''} ${key===cur?'cur':''}" data-a="hmonth" data-v="${key}">${MONTHS[km-1]}${ky!==+HAB_START.slice(0,4)?' ’'+String(ky).slice(2):''}</button>`}).join('')}</div>${habMonth===cur?'':`<button class="btn ghost sm" style="flex:none" data-a="hmonth" data-v="${cur}">Сегодня</button>`}</div>`;
}
let renderedMonth='';
function monthKeys(){
  const [sy,sm]=HAB_START.split('-').map(Number),n=new Date(),end=new Date(n.getFullYear(),n.getMonth()+6,1),out=[];
  for(let d=new Date(sy,sm-1,1);d<=end;d=new Date(d.getFullYear(),d.getMonth()+1,1))out.push(d.getFullYear()+'-'+pad(d.getMonth()+1));
  return out;
}
function habRow(h,y,m,dim,t,isCur){
  const f=h.freq||'daily',st=habStreak(h),ms=monthStats(h,y,m);
  const flabel=f==='daily'?'каждый день':f==='alt'?'через день':((h.dow||[]).map(i=>WD[i]).join(',')||'—');
  let cells='';
  for(let d=1;d<=dim;d++){
    const k=dkey(y,m,d),done=!!h.days[k],skp=!!(h.skip&&h.skip[k]),cls=done?'on':skp?'sk':(!isDue(h,k)?(f==='alt'?'rest':'off'):'');
    cells+=`<button class="c ${cls} ${k===t?'t':''}" ${k>t?'disabled':''} data-a="hd" data-id="${h.id}" data-v="${k}" aria-label="${k}"></button>`;
  }
  return `<div class="hr"><div class="hn" data-a="hedit" data-id="${h.id}" title="Настроить расписание"><b>${esc(h.name)}</b><small>${flabel}</small></div>${cells}</div>`;
}
let habView='marks';
function habStatsBody(){
  const t=today(),cur=t.slice(0,7),[y,mi]=habMonth.split('-').map(Number),m=mi-1,dim=new Date(y,m+1,0).getDate();
  if(!S.habits.length)return '<p class="empty">Добавьте привычки — здесь появится статистика.</p>';
  const elapsed=habMonth<cur?dim:habMonth===cur?+t.slice(8):0;
  const rows=S.habits.map(h=>{
    const ms=monthStats(h,y,m),plan=ms.plan!=null?ms.plan:Math.ceil(elapsed/2);
    return {h,ms,plan,pct:plan?Math.min(100,ms.done/plan*100):0,best:bestStreak(h),now:habStreak(h),wd:weekdayStats(h,y,m)};
  });
  const done=rows.reduce((a,r)=>a+r.ms.done,0),skip=rows.reduce((a,r)=>a+r.ms.skip,0),plan=rows.reduce((a,r)=>a+r.plan,0);
  const pct=plan?Math.min(100,done/plan*100):0,best=rows.reduce((a,r)=>Math.max(a,r.best),0);
  const fl=h=>{const f=h.freq||'daily';return f==='daily'?'каждый день':f==='alt'?'через день':((h.dow||[]).map(i=>WD[i]).join(', ')||'—')};
  return `<div class="ssum"><div><b>${done}</b><span>выполнено</span></div><div><b class="${skip?'down':''}">${skip}</b><span>пропущено ✕</span></div><div><b>${Math.round(pct)}%</b><span>выполнение</span></div><div><b>${best}</b><span>лучшая серия</span></div></div>

    <div class="sp"><div class="l"><span>${r.ms.done}${r.plan?' из '+r.plan:''}</span><span>${Math.round(r.pct)}%</span></div>${bar(r.pct)}</div>
    <div class="sv"><b>${r.ms.skip}</b><span>пропусков</span></div><div class="sv"><b>${r.now}</b><span>серия</span></div><div class="sv"><b>${r.best}</b><span>лучшая</span></div>
    <div class="sw" title="Выполнение по дням недели">${WDL.map((l,i)=>{const p=r.wd.plan[i]?r.wd.done[i]/r.wd.plan[i]*100:0;return `<div class="col" title="${WD[i]}: ${r.wd.done[i]} из ${r.wd.plan[i]}"><div class="b" style="height:${Math.max(3,p*.28)}px"></div><small>${l}</small></div>`}).join('')}</div></div>`).join('')}`;
}
function habitsCard(){

  const marks=`${S.habits.length?`<div class="hscroll"><div class="hm"><div class="hr hh"><div class="hn"></div>${head}</div>${S.habits.map(h=>habRow(h,y,m,dim,t,isCur)).join('')}</div></div><p class="lbl" style="margin:6px 0 0;font-size:12px">Нажатие по дню: ✓ выполнено → ✕ пропуск → снять отметку</p>`:'<p class="empty">Добавьте первую привычку</p>'}
  ${edit}
  <form class="hadd" data-f="addHabit"><input name="name" data-bind="newHab" placeholder="Новая привычка" autocomplete="off" value="${esc(newHabName)}" required><div class="seg">${FREQS.map(([k,n])=>`<button type="button" class="${newFreq===k?'on':''}" data-a="nfreq" data-v="${k}">${n}</button>`).join('')}</div>${newFreq==='dow'?`<div class="wds">${WD.map((n,i)=>`<button type="button" class="${newDow.includes(i)?'on':''}" data-a="ndow" data-v="${i}">${n}</button>`).join('')}</div>`:''}<button class="btn">Добавить</button></form>`;
  return `<section class="card c12"><h3>Привычки<div class="seg hview">${[['marks','Отметки'],['stats','Статистика']].map(([k,n])=>`<button class="${habView===k?'on':''}" data-a="hview" data-v="${k}">${n}</button>`).join('')}</div></h3>
  ${monthChipsHtml()}
  ${habView==='stats'?habStatsBody():marks}</section>`;
}

    deals:[

    <form class="add" data-f="addTx" style="margin:0 0 8px"><input type="number" name="amt" placeholder="Сумма" min="0" step="any" inputmode="decimal" required>${txType==='sv'?`<select name="goal"><option value="">Без цели</option>${S.saves.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>`:`<select name="cat">${allCats(txType).map(c=>`<option>${esc(c)}</option>`).join('')}<option value="__new">＋ Своя категория…</option></select><input name="newcat" placeholder="Название категории" maxlength="24" autocomplete="off" style="display:none">`}<input name="note" placeholder="Заметка" autocomplete="off"><input type="date" name="date" value="${defDate}" required><button class="btn">Добавить</button></form>
    ${list.length?list.map(x=>{const ci=Math.max(0,allCats(x.type).indexOf(x.cat));return `<div class="row"><div class="badge" style="background:${x.type==='in'?'var(--green)':x.type==='sv'?'var(--accent)':PAL[ci%PAL.length]}">${catIco(x.type==='sv'?'Накопления':x.cat)}</div><div class="grow">${esc(x.note||x.cat)}<small>${esc(x.cat)} · ${dshort(x.date)}</small></div><span class="amt ${x.type}">${x.type==='in'?'+':x.type==='sv'?'→ ':'−'}${fmt(x.amt)}</span><button class="x" data-a="dltx" data-id="${x.id}" aria-label="Удалить">×</button></div>`}).join(''):'<p class="empty">Операций за этот месяц нет</p>'}</section>
  <section class="card c5"><h3>Накопления<small>${fmt(totalSaved)}</small></h3>${
    S.saves.length?S.saves.map(g=>{const p=g.target?g.saved/g.target*100:0;return `<div class="item"><div class="top"><span>${esc(g.name)}</span><span class="val">${Math.round(p)}% ${delBtn('saves',g.id)}</span></div>${bar(p)}
      <div class="top" style="margin:8px 0 0"><span class="val">${fmt(g.saved)} из ${fmt(g.target)}</span>
      <form class="add" data-f="deposit" data-id="${g.id}" style="margin:0;flex-wrap:nowrap"><input type="number" name="amt" placeholder="+ сумма" step="any" inputmode="decimal" style="width:90px;padding:6px 10px" required><button class="btn sm">Внести</button></form></div></div>`}).join(''):'<p class="empty">Поставьте первую финансовую цель</p>'
  }<form class="add" data-f="addSave"><input name="name" placeholder="Цель" autocomplete="off" required><input type="number" name="target" placeholder="Сумма" min="1" step="any" inputmode="decimal" required><button class="btn">Добавить</button></form></section>
  </div>`;
},

growth(){
  const done=S.books.filter(b=>b.read>=b.pages).length;
  return `<div class="grid">
  ${habitsCard()}
  <section class="card c12" style="--accent:#23a04b"><h3>Книги<small>${done}/${S.books.length} прочитано</small></h3>${
    S.books.length?S.books.map(b=>`<div class="item"><div class="top"><span>${esc(b.name)}</span><span class="val"><span data-lbl>${b.read} / ${b.pages} стр.</span> ${delBtn('books',b.id)}</span></div>${rangeIn('books',b.id,b.read,b.pages)}</div>`).join(''):'<p class="empty">Список для чтения пуст</p>'
  }<form class="add" data-f="addBook"><input name="name" placeholder="Название книги" autocomplete="off" required><input type="number" name="pages" placeholder="Страниц" min="1" inputmode="numeric" required><button class="btn">Добавить</button></form></section>
  </div>`;
}};

/* ---------- render ---------- */
function cloudBlock(){
  const inp='style="width:100%;margin-bottom:8px"';
  if(!gh)return `<h3 style="margin:14px 0 6px;font-size:15px">☁️ Облако — сохранение в приватный репозиторий GitHub</h3><p class="note" style="margin:0 0 8px">Нужен приватный репозиторий и токен с правом Contents: Read and write только на него.</p><input id="ghr" placeholder="владелец/репозиторий" value="${esc(ghRepoIn)}" ${inp}><input id="ght" type="password" autocomplete="off" placeholder="Токен GitHub (github_pat_…)" ${inp}><div class="acts" style="margin-top:0"><button class="btn sm" data-a="ghon">Подключить</button></div>${cloudMsg?`<p class="note" style="color:var(--accent)">${esc(cloudMsg)}</p>`:''}`;
  const st={saving:'Сохраняется…',synced:'Всё сохранено в облаке'+(lastSync?' · '+new Date(lastSync).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):''),pending:'Ждёт интернета — отправится автоматически',error:'Ошибка облака: проверьте токен и доступ к репозиторию, затем «Синхронизировать»',local:''}[syncState]||'';
  return `<div class="set"><span>☁️ Облако</span><span class="val" style="white-space:normal;text-align:right">${esc(gh.repo)}</span></div><p class="note" style="margin:0 0 8px">${st}</p><div class="acts" style="margin-top:0"><button class="btn ghost sm" data-a="ghsync">Синхронизировать сейчас</button><button class="btn ghost sm" data-a="ghoff">Отключить</button></div>`;
}
function sheetHtml(){
  if(!sheet)return '';
  return `<div class="sheet-bg" data-a="closebg"><div class="sheet" role="dialog" aria-label="Настройки"><h2>Настройки <button class="icon-btn" data-a="close" aria-label="Закрыть">✕</button></h2>
  <div class="set"><span>Ваше имя</span><input data-bind="name" value="${esc(S.name)}" placeholder="Необязательно" style="width:190px"></div>
  <div class="set"><span>Валюта</span><div class="seg">${['₴','$','€','₽'].map(c=>`<button class="${S.cur===c?'on':''}" data-a="cur" data-v="${c}">${c}</button>`).join('')}</div></div>
  <div class="set"><span>Тема</span><div class="seg">${[['light','Светлая'],['dark','Тёмная']].map(([k,n])=>`<button class="${S.theme===k?'on':''}" data-a="theme" data-v="${k}">${n}</button>`).join('')}</div></div>
  ${cloudBlock()}
  <h3 style="margin:16px 0 8px;font-size:15px">Резервная копия</h3>
  <textarea id="bk" style="min-height:90px;font-size:12px;font-family:ui-monospace,Menlo,monospace" placeholder="Здесь появится копия данных. Чтобы восстановить — вставьте сюда ранее сохранённый текст.">${bkText?esc(bkText):''}</textarea>
  <div class="acts"><button class="btn ghost sm" data-a="bkmake">Создать копию</button><button class="btn ghost sm" data-a="bkcopy">Копировать</button><button class="btn ghost sm" data-a="bkfile">Скачать файл</button><button class="btn ghost sm" data-a="bkload">Восстановить из текста</button><button class="btn ghost sm" data-a="import">Из файла</button></div>
  ${sheetMsg?`<p class="note" style="color:var(--accent)">${esc(sheetMsg)}</p>`:''}
  <div class="acts" style="margin-top:18px"><button class="btn danger" data-a="reset">${resetArm?'Точно удалить всё? Нажмите ещё раз':'Очистить все данные'}</button></div></div></div>`;
}
function head(){
  const h=new Date().getHours();
  const g=h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';
  $('#hello').textContent=S.name?`${g}, ${S.name}`:g;
  $('#date').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
}
function render(){
  if(!views[S.tab])S.tab='personal';
  document.body.dataset.tab=S.tab;
  document.documentElement.dataset.theme=S.theme;
  const oldS=document.querySelector('.hscroll'),keepS=oldS&&renderedMonth===habMonth?oldS.scrollLeft:null;
  const v=$('#view');
  v.innerHTML=views[S.tab]();
  if(!anim)v.querySelectorAll('.card').forEach(c=>c.style.animation='none');
  anim=false;
  $('#tabs').innerHTML=TABS.map(t=>`<button class="${S.tab===t.id?'on':''}" data-a="tab" data-v="${t.id}" aria-label="${t.name}"><svg viewBox="0 0 24 24">${t.ic}</svg><span>${t.name}</span></button>`).join('');
  $('#wk').innerHTML=weekBar();
  $('#sheet').innerHTML=sheetHtml();
  const hs=document.querySelector('.hscroll');
  if(hs){if(keepS!==null)hs.scrollLeft=keepS;else{const t=today();hs.scrollLeft=habMonth===t.slice(0,7)?Math.max(0,(+t.slice(8)-8)*28):0}renderedMonth=habMonth}
  const on=document.querySelector('.mchips .on');if(on){const c=on.parentElement;c.scrollLeft=on.offsetLeft-c.clientWidth/2+on.clientWidth/2}
  head();
}

/* ---------- actions ---------- */
const A={
  tab:d=>{S.tab=d.v;anim=true;window.scrollTo({top:0,behavior:'smooth'});return 'skip-save'},
  hview:d=>{habView=d.v;return 'skip-save'},
  hmonth:d=>{habMonth=d.v;return 'skip-save'},
  hyear:d=>{const y=+habMonth.slice(0,4)+ +d.v;habMonth=y+'-'+habMonth.slice(5);return 'skip-save'},
  nfreq:d=>{newFreq=d.v;return 'skip-save'},
  ndow:d=>{const i=+d.v;newDow=newDow.includes(i)?newDow.filter(x=>x!==i):[...newDow,i]; return 'skip-save'},
  hdel:d=>{S.habits=S.habits.filter(x=>x.id!==d.id);editHab=null},
  hedit:d=>{editHab=editHab===d.id?null:d.id;return 'skip-save'},
  hfreq:d=>{const h=S.habits.find(x=>x.id===d.id);h.freq=d.v;if(d.v==='dow'&&!(h.dow||[]).length)h.dow=[0,2,4]},
  hdow:d=>{const h=S.habits.find(x=>x.id===d.id),i=+d.v;h.dow=(h.dow||[]).includes(i)?h.dow.filter(x=>x!==i):[...(h.dow||[]),i]},
  tg:d=>{const i=S[d.k].find(x=>x.id===d.id);if(i)i.done=!i.done},
  dltx:d=>{const t=S.tx.find(x=>x.id===d.id);if(t&&t.type==='sv'&&t.goal){const g=S.saves.find(x=>x.id===t.goal);if(g)g.saved=Math.max(0,g.saved-t.amt)}S.tx=S.tx.filter(x=>x.id!==d.id)},
  dl:d=>{S[d.k]=S[d.k].filter(x=>x.id!==d.id)},
  hd:d=>{const h=S.habits.find(x=>x.id===d.id);h.skip=h.skip||{};const k=d.v;if(h.days[k]){delete h.days[k];h.skip[k]=1}else if(h.skip[k]){delete h.skip[k]}else{h.days[k]=1}},
  mood:d=>{const v=getMood()===+d.v?0:+d.v;S.mood={date:today(),v};S.moodLog=S.moodLog||{};S.moodLog[today()]=v},
  water:d=>{const n=+d.v,v=getWater()===n?n-1:n;S.water={date:today(),n:v};S.waterLog=S.waterLog||{};S.waterLog[today()]=v},
  txtype:d=>{txType=d.v},
  log:d=>{const k=effSel();S[d.k]=S[d.k]||{};S[d.k][k]=Math.round(((S[d.k][k]||0)+ +d.v)*10)/10},
  logclr:d=>{if(S[d.k])delete S[d.k][effSel()]},
  sday:d=>{selDay=d.v;return 'skip-save'},
  wk:d=>{const cur=mondayOf(today()),lo=iso(addDays(kdate(cur),-7*26)),hi=iso(addDays(kdate(cur),7*8)),m=iso(addDays(kdate(W),7*+d.v));W=m<lo?lo:m>hi?hi:m;selDay='';return 'skip-save'},
  wnow:()=>{W=mondayOf(today());selDay='';return 'skip-save'},
  mv:d=>{const x=S.deals.find(q=>q.id===d.id);x.stage=clamp(x.stage+ +d.v,0,2);x.paid=x.stage===2?(x.paid||today()):null},
  settings:()=>{sheet=true;sheetMsg='';resetArm=false;bkText='';return 'skip-save'},
  close:()=>{sheet=false;return 'skip-save'},
  closebg:(d,el,e)=>{if(e.target!==el)return 'skip';sheet=false;return 'skip-save'},
  cur:d=>{S.cur=d.v},
  theme:d=>{S.theme=d.v;return 'skip-save'},
  bkmake:()=>{bkText=JSON.stringify(S);sheetMsg='Копия создана. Скопируйте её или скачайте файл.';return 'skip-save'},
  bkcopy:()=>{
    const t=$('#bk');if(!t.value){bkText=JSON.stringify(S);sheetMsg='Копия создана — нажмите «Копировать» ещё раз.';return 'skip-save'}
    bkText=t.value;t.select();let ok=false;
    try{navigator.clipboard.writeText(t.value);ok=true}catch(e){}
    if(!ok){try{ok=document.execCommand('copy')}catch(e){}}
    sheetMsg=ok?'Скопировано в буфер обмена.':'Не удалось скопировать — выделите текст и скопируйте вручную.';return 'skip-save'},
  bkfile:()=>{
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='dashboard-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();sheetMsg='Если файл не скачался (в некоторых окнах это запрещено) — используйте «Копировать».'}
    catch(e){sheetMsg='Скачивание недоступно — используйте «Копировать».'}
    return 'skip-save'},
  bkload:()=>{
    const v=($('#bk').value||'').trim();
    try{const j=JSON.parse(v);if(typeof j!=='object'||!j||Array.isArray(j))throw 0;S=Object.assign(seed(),j);bkText='';sheetMsg='Данные восстановлены.'}
    catch(e){bkText=v;sheetMsg='Не удалось прочитать текст копии.';return 'skip-save'}},
  ghon:()=>{ghConnect();return 'skip-save'},
  ghoff:()=>{gh=null;syncState='local';try{localStorage.removeItem(GKEY)}catch(e){}cloudMsg='';return 'skip-save'},
  ghsync:()=>{syncState='saving';pull();return 'skip-save'},
  import:()=>{$('#imp').click();return 'skip'},
  reset:()=>{
    if(!resetArm){resetArm=true;return 'skip-save'}
    const keep={tab:S.tab,theme:S.theme,name:S.name,cur:S.cur};
    S=Object.assign(seed(),keep,{tasks:[],habits:[],events:[],notes:'',mood:{date:'',v:0},water:{date:'',n:0},tx:[],budget:0,saves:[],goals:[],books:[],learn:{},refl:{},deals:[],projects:[],ideas:[]});sheet=false;resetArm=false}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const f=A[el.dataset.a];if(!f)return;
  const res=f(el.dataset,el,e);
  if(res==='skip')return;
  if(res==='skip-save')saveLocal();else save();
  render();
});

const F={
  addItem:(fd,d)=>{if(fd.t.trim())S[d.k].push({id:uid(),t:fd.t.trim(),done:false})},
  addHabit:fd=>{
    const dow=newDow.slice().sort(),f=newFreq==='dow'&&!dow.length?'daily':newFreq;
    S.habits.push({id:uid(),name:fd.name.trim(),days:{},freq:f,dow:f==='dow'?dow:[]});
    newFreq='daily';newDow=[];newHabName='';},
  addTask:(fd,d)=>{if(fd.t.trim())S.tasks.push({id:uid(),t:fd.t.trim(),done:false,d:d.d})},
  addEvent:fd=>{S.events.push({id:uid(),t:fd.t.trim(),d:fd.d})},
  addTx:fd=>{if(txType==='sv'){const a=num(fd.amt);if(a<=0)return;const g=S.saves.find(x=>x.id===fd.goal);if(g)g.saved+=a;S.tx.push({id:uid(),type:'sv',amt:a,cat:g?g.name:'Накопления',goal:g?g.id:'',note:fd.note.trim(),date:fd.date||today()});return}let cat=fd.cat;if(cat==='__new'){cat=(fd.newcat||'').trim().slice(0,24);if(!cat)return 'skip';S.cats=S.cats||{out:[],in:[]};if(!allCats(txType).includes(cat))(S.cats[txType]=S.cats[txType]||[]).push(cat)}const a=num(fd.amt);if(a>0)S.tx.push({id:uid(),type:txType,amt:a,cat,note:fd.note.trim(),date:fd.date||today()})},
  addSave:fd=>{S.saves.push({id:uid(),name:fd.name.trim(),target:num(fd.target),saved:0})},
  deposit:(fd,d)=>{const g=S.saves.find(x=>x.id===d.id);if(g)g.saved=Math.max(0,g.saved+num(fd.amt))},
  addGoal:fd=>{S.goals.push({id:uid(),name:fd.name.trim(),p:0})},
  logAdd:(fd,d)=>{const v=num(fd.v);if(v>0){const k=effSel();S[d.k]=S[d.k]||{};S[d.k][k]=Math.round(((S[d.k][k]||0)+v)*10)/10}},
  addBook:fd=>{S.books.push({id:uid(),name:fd.name.trim(),pages:Math.max(1,num(fd.pages)),read:0})},
  addDeal:fd=>{S.deals.push({id:uid(),name:fd.name.trim(),amt:num(fd.amt),stage:0,paid:null})},
  addProject:fd=>{S.projects.push({id:uid(),name:fd.name.trim(),p:0})}
};
document.addEventListener('submit',e=>{
  const form=e.target.closest('form[data-f]');if(!form)return;e.preventDefault();
  const name=form.dataset.f;F[name](Object.fromEntries(new FormData(form)),form.dataset);
  save();render();
  const again=document.querySelector(`form[data-f="${name}"]${form.dataset.k?`[data-k="${form.dataset.k}"]`:''} input:not([type=date])`);
  if(again&&name!=='deposit')again.focus({preventScroll:true});
});
/* live sliders / text binding */
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.r){
    const key=el.dataset.r,item=S[key].find(x=>x.id===el.dataset.id);if(!item)return;
    const v=+el.value,max=+el.max;
    if(key==='books')item.read=v;else item.p=v;
    el.style.setProperty('--p',(max?v/max*100:0)+'%');
    const lbl=el.closest('.item').querySelector('[data-lbl]');
    if(lbl)lbl.textContent=key==='books'?`${v} / ${item.pages} стр.`:v+'%';
    save();
  }else if(el.dataset.bind){
    const b=el.dataset.bind;
    if(b==='newHab'){newHabName=el.value;return}
    if(b==='refl')S.refl[effSel()]=el.value;else if(b==='wnote'){S.weekNotes=S.weekNotes||{};S.weekNotes[W]=el.value}else S[b]=el.value;
    save();
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.name==='cat'&&el.form&&el.form.dataset.f==='addTx'){const n=el.form.elements.newcat;if(n){const on=el.value==='__new';n.style.display=on?'':'none';n.required=on;if(on)n.focus()}return}
  if(el.dataset.set){S[el.dataset.set]=Math.max(0,num(el.value));save();render()}
  else if(el.dataset.r||(el.dataset.bind==='name')){save();render()}
  else if(el.id==='imp'&&el.files[0]){
    const r=new FileReader();
    r.onload=()=>{try{const j=JSON.parse(r.result);if(typeof j!=='object'||!j)throw 0;S=Object.assign(seed(),j);sheetMsg='Данные восстановлены из файла.';save()}catch(_){sheetMsg='Не удалось прочитать файл резервной копии.'}el.value='';render()};
    r.readAsText(el.files[0]);
  }
});

/* ---------- network status ---------- */
function net(){
  const on=navigator.onLine,n=$('#net');let txt,warn=!on;
  if(!on)txt=gh?'Офлайн · сохранится позже':'Офлайн';
  else if(!gh){txt='Подключить облако';warn=true}
  else if(syncState==='saving')txt='Сохранение…';
  else if(syncState==='pending'){txt='Ждёт сети';warn=true}
  else if(syncState==='error'){txt='Ошибка облака';warn=true}
  else txt='☁ Сохранено';
  n.classList.toggle('off',warn);n.querySelector('span').textContent=txt;
}
addEventListener('online',()=>{net();if(gh)setTimeout(pull,1200)});addEventListener('offline',net);
addEventListener('focus',()=>{if(gh&&!pushT&&!pushing)pull()});
setInterval(()=>{if(gh&&syncState==='pending'&&navigator.onLine)pull()},30000);
setInterval(head,60000);
net();render();if(gh)pull();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
